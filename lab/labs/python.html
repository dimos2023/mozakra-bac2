<!doctype html>
<html lang="ar" dir="rtl" class="guard-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <title>معمل بايثون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <script type="module" src="../assets/guard.js"></script>
  <style>
    .py-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 800px) { .py-layout { grid-template-columns: 1fr; } }
    #editor { min-height: 320px; }
  </style>
</head>
<body data-lab="python" data-root="..">
<main class="container">
  <div id="labHead" data-lead="اكتب كود بايثون حقيقي بيتنفذ جوه المتصفح — مش محتاج تسطّب حاجة. كل تحدي مربوط بدرس، ولما تضغط <b>صحّح</b> الكود بيتختبر على حالات مختلفة والنتيجة بتظهر فورًا."></div>

  <p id="pyStatus" class="pill info">⏳ جاري تحميل بايثون في المتصفح (أول مرة بس بتاخد شوية)...</p>

  <div class="py-layout">
    <div class="card" style="margin-top:0">
      <h3>التحديات</h3>
      <div class="challenge-list" id="chList"></div>
    </div>
    <div>
      <div class="card task" id="chCard" style="margin-top:0">
        <div class="task-head"><h3 id="chTitle"></h3><span class="lesson-tag" id="chLesson"></span><span class="task-badge"></span></div>
        <div id="chDesc"></div>
        <textarea id="editor" class="code" spellcheck="false" aria-label="محرر الكود"></textarea>
        <div class="row">
          <button class="btn ghost" id="run" type="button" disabled>▶ شغّل</button>
          <button class="btn" id="check" type="button" disabled>✅ صحّح</button>
          <button class="btn ghost small" id="reset" type="button">↺ رجّع الكود الأصلي</button>
        </div>
        <label>المخرجات</label>
        <pre class="output" id="out"></pre>
        <div class="table-wrap" id="testsWrap" style="margin-top:10px"></div>
        <div class="result"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/py-runner.js"></script>
<script>
  const CHALLENGES = [
    {
      id: 'c1', lesson: '2-3', title: 'مستوى الخطر',
      desc: `<p>اكتب دالة <code>risk_level(impact, likelihood)</code> تحسب <b>درجة الخطر = التأثير × الاحتمالية</b> (كل واحدة من 1 لـ 3) وترجّع:</p>
        <ul><li><code>"عالي"</code> لو الدرجة 6 أو أكتر</li><li><code>"متوسط"</code> لو من 3 لـ 5</li><li><code>"منخفض"</code> لو أقل من 3</li></ul>`,
      starter: `def risk_level(impact, likelihood):
    score = impact * likelihood
    # كمّل هنا: رجّع "عالي" أو "متوسط" أو "منخفض"
    pass


print(risk_level(3, 3))
`,
      tests: [['risk_level(3, 3)', "'عالي'"], ['risk_level(3, 2)', "'عالي'"], ['risk_level(2, 2)', "'متوسط'"],
              ['risk_level(1, 3)', "'متوسط'"], ['risk_level(1, 2)', "'منخفض'"], ['risk_level(1, 1)', "'منخفض'"]],
    },
    {
      id: 'c2', lesson: '2-1', title: 'شفرة قيصر',
      desc: `<p>اكتب دالة <code>caesar(text, shift)</code> تزق كل حرف إنجليزي بمقدار <code>shift</code> وتحافظ على الحروف الكبيرة كبيرة والصغيرة صغيرة، وأي حاجة تانية (مسافات/رموز) تفضل زي ما هي.</p>
        <p class="hint">مساعدة: <code>ord('A')</code> = 65، و <code>chr(66)</code> = 'B'، والباقي <code>% 26</code> بيرجّعك لأول الحروف.</p>`,
      starter: `def caesar(text, shift):
    result = ""
    for ch in text:
        if ch.isupper():
            # كمّل هنا
            result += ch
        elif ch.islower():
            # وهنا
            result += ch
        else:
            result += ch
    return result


print(caesar("HELLO", 3))   # المفروض: KHOOR
`,
      tests: [['caesar("ABC", 1)', "'BCD'"], ['caesar("xyz", 3)', "'abc'"], ['caesar("HTTPS IS SAFE", 7)', "'OAAWZ PZ ZHML'"],
              ['caesar("Hi, Ali!", 0)', "'Hi, Ali!'"], ['caesar(caesar("Secret Msg", 5), 21)', "'Secret Msg'"]],
    },
    {
      id: 'c3', lesson: '2-1', title: 'فاحص كلمة المرور',
      desc: `<p>اكتب دالة <code>is_strong(password)</code> ترجّع <code>True</code> لو الباسورد:</p>
        <ul><li>طوله 12 أو أكتر</li><li>فيه حرف كبير وحرف صغير</li><li>فيه رقم</li></ul><p>وغير كده ترجّع <code>False</code>.</p>
        <p class="hint">مساعدة: <code>any(c.isdigit() for c in password)</code></p>`,
      starter: `def is_strong(password):
    # كمّل هنا
    return False


print(is_strong("Cairo-Tower-2026"))
print(is_strong("123456"))
`,
      tests: [['is_strong("Cairo-Tower-2026")', 'True'], ['is_strong("123456")', 'False'], ['is_strong("abcdefghijk1")', 'False'],
              ['is_strong("ABCDEFGHIJK1")', 'False'], ['is_strong("Abcdefghijkl")', 'False'], ['is_strong("Abc1")', 'False'],
              ['is_strong("MyCat4Ever2008")', 'True']],
    },
    {
      id: 'c4', lesson: '2-1', title: 'بصمة SHA-256',
      desc: `<p>اكتب دالة <code>fingerprint(text)</code> ترجّع بصمة <b>SHA-256</b> للنص بصيغة hex، ودالة <code>is_intact(text, official_hash)</code> ترجّع <code>True</code> لو النص ماتعدّلش.</p>
        <p class="hint">مساعدة: <code>hashlib.sha256(text.encode()).hexdigest()</code></p>`,
      starter: `import hashlib


def fingerprint(text):
    # كمّل هنا
    pass


def is_intact(text, official_hash):
    # استخدم fingerprint
    pass


print(fingerprint("hello"))
`,
      tests: [['fingerprint("hello")', "hashlib.sha256(b'hello').hexdigest()"],
              ['fingerprint("مرحبا")', "hashlib.sha256('مرحبا'.encode()).hexdigest()"],
              ['is_intact("grade: 15", hashlib.sha256(b"grade: 15").hexdigest())', 'True'],
              ['is_intact("grade: 19", hashlib.sha256(b"grade: 15").hexdigest())', 'False']],
    },
    {
      id: 'c5', lesson: '5-2', title: 'تنظيف البيانات',
      desc: `<p>جالك كشف درجات من 20 فيه مشاكل: قيم ناقصة (<code>None</code>) وقيم شاذة غلط (أقل من 0 أو أكبر من 20).</p>
        <p>اكتب دالة <code>clean_average(grades)</code> تشيل القيم الناقصة والشاذة، وترجّع متوسط الباقي مقرّب لرقم عشري واحد <code>round(x, 1)</code>. ولو مفضلش حاجة ترجّع <code>0</code>.</p>`,
      starter: `def clean_average(grades):
    clean = []
    for g in grades:
        # كمّل هنا: ضيف g لـ clean لو صالحة بس
        pass
    # رجّع المتوسط
    return 0


print(clean_average([18, None, 20, -5, 15, 200]))   # المفروض 17.7
`,
      tests: [['clean_average([18, None, 20, -5, 15, 200])', '17.7'], ['clean_average([10, 20])', '15.0'],
              ['clean_average([None, None])', '0'], ['clean_average([0, 20, 21, -1])', '10.0'], ['clean_average([])', '0']],
    },
  ];

  let pyReady = false, current = CHALLENGES[0];
  const editor = document.getElementById('editor');
  const DRAFT = id => 'cyberlab-py-' + id;
  const loadDraft = ch => { try { return localStorage.getItem(DRAFT(ch.id)); } catch { return null; } };
  const saveDraft = () => { try { localStorage.setItem(DRAFT(current.id), editor.value); } catch { /* تجاهل */ } };

  function renderList() {
    const list = document.getElementById('chList');
    list.innerHTML = '';
    CHALLENGES.forEach((ch, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = ch === current ? 'active' : '';
      b.innerHTML = `${i + 1}. ${ch.title} <span class="st">${isDone('python', ch.id) ? '✅' : ''}</span>`;
      b.onclick = () => { saveDraft(); select(ch); };
      list.appendChild(b);
    });
  }
  function select(ch) {
    current = ch;
    const card = document.getElementById('chCard');
    card.dataset.task = ch.id;
    document.getElementById('chTitle').textContent = ch.title;
    document.getElementById('chLesson').textContent = 'الدرس ' + ch.lesson;
    document.getElementById('chDesc').innerHTML = ch.desc;
    editor.value = loadDraft(ch) ?? ch.starter;
    document.getElementById('out').textContent = '';
    document.getElementById('testsWrap').innerHTML = '';
    card.querySelector('.result').className = 'result';
    renderList();
    refreshTasks();
    card.querySelector('.task-badge').textContent = isDone('python', ch.id) ? '✓ تمت' : 'تحدي';
  }

  tabIndent(editor);
  editor.addEventListener('input', saveDraft);

  async function execute(withTests) {
    if (!pyReady) return;
    const res = PyRunner.run(editor.value, withTests ? current.tests : []);
    const out = document.getElementById('out');
    out.textContent = (res.out || '') + (res.err ? '\n' + res.err : '') || '(مفيش مخرجات — استخدم print)';
    return res;
  }

  document.getElementById('run').onclick = () => execute(false);
  document.getElementById('check').onclick = async () => {
    const res = await execute(true);
    const card = document.getElementById('chCard');
    const r = card.querySelector('.result');
    const wrap = document.getElementById('testsWrap');
    if (res.err) { wrap.innerHTML = ''; return showResult(r, 'bad', 'الكود فيه خطأ — بص على المخرجات فوق وصلّحه.'); }
    const passed = res.tests.filter(t => t.ok).length;
    wrap.innerHTML = renderTestsTable(res.tests);
    if (passed === res.tests.length) {
      showResult(r, 'ok', `✓ عدّى كل الاختبارات (${passed}/${passed}) 🎉`);
      markDone(current.id);
      renderList();
      card.querySelector('.task-badge').textContent = '✓ تمت';
    } else {
      showResult(r, 'bad', `✗ عدّى ${passed} من ${res.tests.length} اختبارات. بص على الجدول وشوف الفرق بين المتوقع والناتج.`);
    }
  };
  document.getElementById('reset').onclick = () => {
    if (confirm('هترجع للكود الأصلي وتمسح اللي كتبته في التحدي ده. متأكد؟')) { editor.value = current.starter; saveDraft(); }
  };

  document.addEventListener('DOMContentLoaded', () => {
    select(CHALLENGES[0]);
    PyRunner.load().then(() => {
      pyReady = true;
      const st = document.getElementById('pyStatus');
      st.className = 'pill ok'; st.textContent = '✓ بايثون جاهز';
      document.getElementById('run').disabled = document.getElementById('check').disabled = false;
    }).catch(() => {
      const st = document.getElementById('pyStatus');
      st.className = 'pill bad'; st.textContent = '⛔ فشل تحميل بايثون — اتأكد من الإنترنت واعمل ريفرش';
    });
  });
</script>
</body>
</html>
